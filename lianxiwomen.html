<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .frosted-glass {
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
            color: #333;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .qr-code {
            margin: 20px auto;
            width: 507px;
            height: 504px;
            background-color: #f5f5f5;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .qr-code img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 5px;
        }
        
        .text-content {
            margin: 30px 0;
            text-align: center;
            line-height: 1.8;
        }
        
        .text-line {
            margin: 8px 0;
            font-size: 1.1rem;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .google-btn {
            margin-top: 20px;
            background-color: #4285f4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .google-btn:hover {
            background-color: #3367d6;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }
        
        .google-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.2);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .frosted-glass {
                width: 95%;
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .qr-code {
                width: 100%;
                height: auto;
                max-width: 400px;
                aspect-ratio: 507/504;
            }
            
            .text-line {
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .qr-code {
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="frosted-glass">
        <h1>联系我们</h1>
        <div class="qr-code">
            <!-- 这里放置微信二维码图片 -->
            <img src="weixin.jpg" alt="微信二维码">
        </div>
        <div class="text-content">
            <div class="text-line">使用微信扫描上面的二维码可添加我的微信</div>
            <div class="text-line">个人邮箱：ljh18259239225@outlook.com</div>
            <div class="text-line">团队邮箱：lao6os@lao6osdevteam.onmicrosoft.com</div>
            <div class="text-line">抖音号：lao6_computer</div>
            <div class="text-line"> </div>
            <div class="text-line"> </div>
            <div class="text-line"> </div>
            <div class="text-line"> </div>
            <div class="text-line"> </div>
            <div class="text-line"> </div>
        </div>
        <button class="google-btn" onclick="window.location.href='https://douyin-lao6pc.github.io/web/index.html'">返回</button>
    </div>

    <script>
        // 按钮点击事件处理
        document.querySelector('.google-btn').addEventListener('click', function() {
            // 这里可以添加跳转链接
            // window.location.href = '你的链接地址';
            alert('请稍后');
        });
    </script>
</body>
</html>
